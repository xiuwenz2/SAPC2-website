<!doctype html>
<html lang="en">
  <head>
    {%- if site.title -%}
    <title>{{ page.title }} | {{ site.title }}</title>
    {%- endif -%}
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  </head>
  <body>
    <div class="wrapper">

      <!-- HEADER: title + nav on the same line -->
      <header class="site-header">
        <div class="site-title-nav">
          <div>
            <a class="site-title" href="{{ site.baseurl }}/">
              {{ site.title }}
            </a>
            {%- if page.subtitle -%}
            <p class="site-subtitle">{{ page.subtitle }}</p>
            {%- endif -%}
          </div>

          <nav class="site-nav">
            <a class="nav-highlight" href="{{ site.baseurl }}/news/">News</a>
            <a href="{{ site.baseurl }}/timeline/">Timeline</a>
            <a href="{{ site.baseurl }}/leaderboard/">Leaderboard</a>
            <a href="{{ site.baseurl }}/baseline/">Baseline</a>
            <a href="{{ site.baseurl }}/faqs/">FAQs</a>
          </nav>
        </div>
      </header>

      <main class="page-content" aria-label="Content">
        {{ content }}
      </main>

      <footer class="site-footer">
        <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }}</p>
      </footer>
    </div>
  </body>
</html>
